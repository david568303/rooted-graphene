name: APatch KPM build

# Builds the APatch kernel modules under kernelpatch-modules/ against the pinned
# KernelPatch headers and toolchain, and uploads the .kpm files as a workflow
# artifact. Load them at runtime with APatch (kpm load) after boot; they are not
# embedded in the kernel image, so a faulty module is recoverable with a reboot.

on:
  workflow_dispatch:
    inputs:
      device-id:
        description: Device ID (selects the default KernelPatch commit)
        required: true
        default: mustang
      kernelpatch-commit:
        description: KernelPatch source commit (empty uses the pinned mustang test commit)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y jq curl git xz-utils make
      - name: Build APatch KPMs
        env:
          DEVICE_ID: ${{ inputs.device-id }}
          KERNELPATCH_COMMIT: ${{ inputs.kernelpatch-commit }}
        run: bash -c '. rooted-ota.sh && buildAPatchKpm'
      - uses: actions/upload-artifact@v7
        with:
          name: apatch-kpm-${{ inputs.device-id }}
          path: .tmp/apatch-kpm/
          retention-days: 14
          if-no-files-found: error
