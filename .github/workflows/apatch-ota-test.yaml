name: APatch OTA test

# Builds the full APatch OTA, signed with the repo keys through avbroot, as a
# workflow artifact for hardware testing. Nothing is released and nothing is
# pushed to any OTA feed. Install it the normal README way (extract, flashall,
# custom AVB key, sideload).

on:
  workflow_dispatch:
    inputs:
      device-id:
        description: Device ID
        required: true
        default: mustang
      ota-version:
        description: GrapheneOS OTA version installed on the device, or latest
        required: false
        default: latest
      kernelpatch-commit:
        description: KernelPatch source commit (empty uses the pinned mustang test commit)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Validate signing secrets
        env:
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
          KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 }}
          KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 }}
          CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 }}
        run: |
          missing=()
          for name in PASSPHRASE_AVB PASSPHRASE_OTA KEY_AVB_BASE64 KEY_OTA_BASE64 CERT_OTA_BASE64; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required repository secrets: ${missing[*]}" >&2
            exit 1
          fi
      # jq, curl, git, cmake, make and xz-utils are all preinstalled on ubuntu-latest.
      - name: Build APatch test OTA
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVICE_ID: ${{ inputs.device-id }}
          OTA_VERSION: ${{ inputs.ota-version }}
          KERNELPATCH_COMMIT: ${{ inputs.kernelpatch-commit }}
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
          KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 }}
          KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 }}
          CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 }}
        run: bash -c '. rooted-ota.sh && createAPatchTestOta'
      - uses: actions/upload-artifact@v7
        with:
          name: apatch-ota-test-${{ inputs.device-id }}
          path: .tmp/apatch-test-ota/
          retention-days: 14
          if-no-files-found: error
