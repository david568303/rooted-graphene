name: Release single device

on:
  workflow_call:
    inputs:
      device-id:
        type: string
      magisk-preinit-device:
        type: string
        default: ''
      skip-rooted:
        description: skip all rooted OTA flavors
        type: boolean
        default: false
      skip-rootless:
        description: skip building the rootless OTA
        type: boolean
        default: false
      skip-magisk:
        description: skip building the upstream Magisk OTA
        type: boolean
        default: false
      skip-pixincreate:
        description: skip building the pixincreate Magisk OTA
        type: boolean
        default: true
      pixincreate-version:
        description: pixincreate Magisk version or latest
        type: string
        default: ''
      pixincreate-apk-name:
        description: optional pixincreate release asset name override
        type: string
        default: ''
      ota-version:
        description: GrapheneOS OTA version or latest
        type: string
        default: ''
      magisk-version:
        description: upstream Magisk version or latest
        type: string
        default: ''
      force-build:
        description: force building an existing GrapheneOS device/flavor release
        type: boolean
        default: false
      force-ota-server-upload:
        description: force updating the OTA server feed
        type: boolean
        default: false
      upload-test-ota:
        description: publish to the test feed
        type: boolean
        default: false
      skip-release:
        description: build and validate without publishing
        type: boolean
        default: false
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      device-id:
        description: Device ID
        required: true
      magisk-preinit-device:
        description: Magisk preinit device
        required: false
      skip-rootless:
        description: skip building rootless OTA
        type: boolean
        required: false
      skip-rooted:
        description: skip all rooted OTA flavors
        type: boolean
        required: false
      skip-magisk:
        description: skip building the upstream Magisk OTA
        type: boolean
        required: false
      skip-pixincreate:
        description: skip building OTA rooted with pixincreate's magisk fork
        type: boolean
        required: false
        default: true
      upload-test-ota:
        description: Upload OTA to test folder
        required: false
        type: boolean
      force-build:
        description: Force artifacts to be built and uploaded to release if non-existing
        required: false
        type: boolean
      force-ota-server-upload:
        description: Force OTA server upload
        required: false
        type: boolean
      skip-release:
        description: Skip release (build only)
        required: false
        type: boolean
      ota-version:
        description: OTA version
        required: false
      magisk-version:
        description: Magisk version
        required: false
      pixincreate-version:
        description: pixincreate Magisk version or latest
        required: false
      pixincreate-apk-name:
        description: optional pixincreate release asset name override
        required: false

permissions:
  contents: write

jobs:
  build-device:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Make sure to not waste hours when some command does not return 
    steps:
      - uses: actions/checkout@v7
        with:
          # Allow for switching to github-pages branch
          fetch-depth: 0
      - name: Set inputs
        # Empty means, use version defined in rooted-ota.sh
        env:
          DEVICE_ID_INPUT: ${{ inputs.device-id || 'shiba' }}
          MAGISK_PREINIT_DEVICE_INPUT: ${{ inputs.magisk-preinit-device || 'sda10' }}
          MAGISK_VERSION_INPUT: ${{ inputs.magisk-version || '' }}
          PIXINCREATE_VERSION_INPUT: ${{ inputs.pixincreate-version || '' }}
          PIXINCREATE_APK_NAME_INPUT: ${{ inputs.pixincreate-apk-name || '' }}
          OTA_VERSION_INPUT: ${{ inputs.ota-version || '' }}
          SKIP_ROOTED_INPUT: ${{ toJSON(inputs.skip-rooted) == 'true' && 'true' || 'false' }}
          SKIP_ROOTLESS_INPUT: ${{ toJSON(inputs.skip-rootless) == 'true' && 'true' || 'false' }}
          SKIP_MAGISK_INPUT: ${{ toJSON(inputs.skip-magisk) == 'true' && 'true' || 'false' }}
          SKIP_PIXINCREATE_INPUT: ${{ toJSON(inputs.skip-pixincreate) == 'false' && 'false' || 'true' }}
          FORCE_OTA_SERVER_UPLOAD_INPUT: ${{ toJSON(inputs.force-ota-server-upload) == 'true' && 'true' || 'false' }}
          FORCE_BUILD_INPUT: ${{ toJSON(inputs.force-build) == 'true' && 'true' || 'false' }}
          UPLOAD_TEST_OTA_INPUT: ${{ toJSON(inputs.upload-test-ota) == 'true' && 'true' || 'false' }}
          SKIP_RELEASE_INPUT: ${{ toJSON(inputs.skip-release) == 'true' && 'true' || 'false' }}
          GITHUB_TOKEN_INPUT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DEVICE_ID=$(echo "$DEVICE_ID_INPUT" | xargs)" >> "$GITHUB_ENV"
          if [[ "$SKIP_ROOTED_INPUT" != "true" ]]; then
            echo "MAGISK_PREINIT_DEVICE=$(echo "$MAGISK_PREINIT_DEVICE_INPUT" | xargs)" >> "$GITHUB_ENV"
          fi
          
          echo "MAGISK_VERSION=$(echo "$MAGISK_VERSION_INPUT" | xargs)" >> "$GITHUB_ENV"
          echo "PIXINCREATE_VERSION=$(echo "$PIXINCREATE_VERSION_INPUT" | xargs)" >> "$GITHUB_ENV"
          echo "PIXINCREATE_APK_NAME=$(echo "$PIXINCREATE_APK_NAME_INPUT" | xargs)" >> "$GITHUB_ENV"
          echo "OTA_VERSION=$(echo "$OTA_VERSION_INPUT" | xargs)" >> "$GITHUB_ENV"
          echo "FORCE_OTA_SERVER_UPLOAD=$FORCE_OTA_SERVER_UPLOAD_INPUT" >> "$GITHUB_ENV"
          echo "FORCE_BUILD=$FORCE_BUILD_INPUT" >> "$GITHUB_ENV"
          echo "UPLOAD_TEST_OTA=$UPLOAD_TEST_OTA_INPUT" >> "$GITHUB_ENV"
          echo "SKIP_ROOTLESS=$SKIP_ROOTLESS_INPUT" >> "$GITHUB_ENV"
          echo "SKIP_MAGISK=$SKIP_MAGISK_INPUT" >> "$GITHUB_ENV"
          echo "SKIP_PIXINCREATE=$SKIP_PIXINCREATE_INPUT" >> "$GITHUB_ENV"
          echo "SKIP_RELEASE=$SKIP_RELEASE_INPUT" >> "$GITHUB_ENV"
          
          echo "GITHUB_TOKEN=$GITHUB_TOKEN_INPUT" >> "$GITHUB_ENV"
      - run: sudo apt-get install -y jq curl git
      - name: release
        env:
          GITHUB_REPO: ${{ github.repository }}
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB || env.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA || env.PASSPHRASE_OTA }}
          KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 || env.KEY_AVB_BASE64 }}
          KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 || env.KEY_OTA_BASE64 }}
          CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 || env.CERT_OTA_BASE64 }}
        run: |
          if [[ $SKIP_RELEASE == 'true' ]]; then
            bash -c '. rooted-ota.sh && createRootedOta && createOtaServerData'
          else
            bash -c '. rooted-ota.sh && createAndReleaseRootedOta'
          fi
