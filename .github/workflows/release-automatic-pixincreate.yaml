name: Automatic pixincreate OTAs

on:
  # Each device job exits before downloading an OTA when that device/flavor is
  # already present for the current GrapheneOS security-preview release.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-pixincreate-otas
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      # Limit simultaneous multi-gigabyte downloads and gh-pages pushes.
      max-parallel: 6
      matrix:
        include:
          - device-id: stallion # Pixel 10a
            magisk-preinit-device: sda10
          - device-id: rango # Pixel 10 Pro Fold
            magisk-preinit-device: sda10
          - device-id: mustang # Pixel 10 Pro XL
            magisk-preinit-device: sda10
          - device-id: blazer # Pixel 10 Pro
            magisk-preinit-device: sda10
          - device-id: frankel # Pixel 10
            magisk-preinit-device: sda10
          - device-id: tegu # Pixel 9a
            magisk-preinit-device: sda10
          - device-id: comet # Pixel 9 Pro Fold
            magisk-preinit-device: sda10
          - device-id: komodo # Pixel 9 Pro XL
            magisk-preinit-device: sda10
          - device-id: caiman # Pixel 9 Pro
            magisk-preinit-device: sda10
          - device-id: tokay # Pixel 9
            magisk-preinit-device: sda10
          - device-id: akita # Pixel 8a
            magisk-preinit-device: sda10
          - device-id: husky # Pixel 8 Pro
            magisk-preinit-device: sda10
          - device-id: shiba # Pixel 8
            magisk-preinit-device: sda10
          - device-id: felix # Pixel Fold
            magisk-preinit-device: sda8
          - device-id: tangorpro # Pixel Tablet
            magisk-preinit-device: sda5
          - device-id: lynx # Pixel 7a
            magisk-preinit-device: sda8
          - device-id: cheetah # Pixel 7 Pro
            magisk-preinit-device: sda8
          - device-id: panther # Pixel 7
            magisk-preinit-device: sda8
          - device-id: bluejay # Pixel 6a
            magisk-preinit-device: sda8
          - device-id: raven # Pixel 6 Pro
            magisk-preinit-device: metadata
          - device-id: oriole # Pixel 6
            magisk-preinit-device: metadata
    uses: ./.github/workflows/release-single.yaml
    secrets: inherit
    with:
      device-id: ${{ matrix.device-id }}
      magisk-preinit-device: ${{ matrix.magisk-preinit-device }}
      skip-rootless: true
      skip-magisk: true
      skip-pixincreate: false
      # APatch is never published automatically (see ALLOW_APATCH_RELEASE).
      skip-apatch: true
      # No pixincreate-version: use DEFAULT_PIXINCREATE_VERSION from rooted-ota.sh,
      # so new third-party root releases only ship after a reviewed Renovate PR.
