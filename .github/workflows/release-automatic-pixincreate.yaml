name: Automatic pixincreate OTAs

on:
  # A single cheap `detect` job resolves which devices still need a build for the
  # current GrapheneOS release and only then fans out to per-device build jobs.
  # Idle runs (nothing new) therefore cost one job instead of one per device.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-pixincreate-otas
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
      any: ${{ steps.gate.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide which devices need a build
        id: gate
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash -c '. rooted-ota.sh && emitBuildMatrix pixincreate \
            stallion:sda10 rango:sda10 mustang:sda10 blazer:sda10 frankel:sda10 \
            tegu:sda10 comet:sda10 komodo:sda10 caiman:sda10 tokay:sda10 \
            akita:sda10 husky:sda10 shiba:sda10 felix:sda8 tangorpro:sda5 \
            lynx:sda8 cheetah:sda8 panther:sda8 bluejay:sda8 raven:metadata \
            oriole:metadata' >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      # Limit simultaneous multi-gigabyte downloads and gh-pages pushes.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/release-single.yaml
    secrets: inherit
    with:
      device-id: ${{ matrix.device-id }}
      magisk-preinit-device: ${{ matrix.magisk-preinit-device }}
      skip-rootless: true
      skip-pixincreate: false
      # APatch is published by its own workflow (release-automatic-apatch.yaml).
      skip-apatch: true
      # No pixincreate-version: use DEFAULT_PIXINCREATE_VERSION from rooted-ota.sh,
      # so new third-party root releases only ship after a reviewed Renovate PR.
